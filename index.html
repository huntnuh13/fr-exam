<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Face Recognition Exam</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; font-family:'Inter','Segoe UI',system-ui,-apple-system,sans-serif; }
  :root {
    --bg-0: #0a0f1c; --bg-1: #0f172a; --bg-2: #1e293b;
    --border: #24334a; --border-hi: #2f4260;
    --text-0: #f1f5f9; --text-1: #cbd5e1; --text-2: #94a3b8; --text-3: #64748b;
    --accent: #38bdf8; --accent-glow: rgba(56,189,248,0.18);
    --ok: #22c55e; --warn: #eab308; --err: #ef4444;
  }
  html, body { overflow-x: hidden; max-width: 100%; }
  body {
    min-height: 100vh; min-height: 100dvh;
    background: radial-gradient(ellipse 800px 600px at 50% -10%, rgba(56,189,248,0.10), transparent 70%), linear-gradient(180deg, var(--bg-0) 0%, #060a14 100%);
    color:var(--text-0); display:flex; align-items:flex-start; justify-content:center; padding:32px 16px;
    -webkit-font-smoothing:antialiased; -webkit-tap-highlight-color: transparent;
  }
  .container {
    width:100%; max-width:840px; background:linear-gradient(180deg, rgba(15,23,42,0.96) 0%, rgba(10,15,28,0.96) 100%);
    border:1px solid var(--border); border-radius:20px; padding:44px 44px 40px;
    box-shadow: 0 40px 100px rgba(0,0,0,0.6), 0 0 0 1px rgba(255,255,255,0.02) inset, 0 1px 0 rgba(255,255,255,0.04) inset;
    animation:fadeIn 0.4s ease; position:relative; overflow:hidden;
  }
  .container::before { content:''; position:absolute; top:0; left:0; right:0; height:1px; background:linear-gradient(90deg, transparent, var(--accent), transparent); opacity:0.6; }
  @keyframes fadeIn { from{opacity:0;transform:translateY(12px)} to{opacity:1;transform:translateY(0)} }
  @keyframes slideUp { from{opacity:0;transform:translateY(10px)} to{opacity:1;transform:translateY(0)} }
  @keyframes pulse { 0%{transform:scale(1)} 50%{transform:scale(1.015)} 100%{transform:scale(1)} }
  @keyframes shake { 0%,100%{transform:translateX(0)} 25%{transform:translateX(-6px)} 75%{transform:translateX(6px)} }
  @keyframes pop { 0%{transform:scale(0.85);opacity:0} 100%{transform:scale(1);opacity:1} }

  .brand { display:flex; align-items:center; justify-content:center; gap:16px; margin-bottom:6px; }
  .brand-icon { width:56px; height:56px; flex-shrink:0; }
  .brand-text { display:flex; flex-direction:column; align-items:flex-start; }
  .brand-title { font-size:1.65rem; font-weight:700; letter-spacing:-0.02em; color:var(--text-0); line-height:1.1; }
  .brand-sub { font-size:0.72rem; font-weight:600; letter-spacing:0.18em; text-transform:uppercase; color:var(--accent); margin-top:2px; }
  .page-title { text-align:center; font-size:1.5rem; font-weight:700; color:var(--text-0); margin:8px 0 6px; letter-spacing:-0.01em; }
  .subtitle { text-align:center; color:var(--text-2); margin-bottom:32px; font-size:0.9rem; line-height:1.5; }
  .subtitle b { font-weight:700; }

  .field { margin-bottom:18px; }
  label { display:block; margin-bottom:8px; font-weight:600; color:var(--text-2); font-size:0.75rem; text-transform:uppercase; letter-spacing:0.1em; }
  input[type="text"], select {
    width:100%; padding:15px 18px; background:rgba(10,15,28,0.8); border:1px solid var(--border); border-radius:10px;
    color:var(--text-0); font-size:1rem; font-weight:500; transition:border-color .15s, box-shadow .15s; outline:none; appearance:none; font-family:inherit;
  }
  input[type="text"]:focus, select:focus { border-color:var(--accent); box-shadow:0 0 0 3px var(--accent-glow); }
  input::placeholder { color:var(--text-3); }
  select { background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%2364748b' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3e%3cpolyline points='6 9 12 15 18 9'%3e%3c/polyline%3e%3c/svg%3e"); background-repeat: no-repeat; background-position: right 1rem center; background-size: 1em; padding-right: 2.5rem; }

  .btn {
    display:inline-flex; align-items:center; justify-content:center; gap:8px; width:100%; padding:15px 20px;
    background:var(--accent); color:#04121e; border:none; border-radius:10px; font-size:1rem; font-weight:700;
    cursor:pointer; transition:background .15s, transform .1s, box-shadow .15s; margin-top:10px; letter-spacing:0.01em; font-family:inherit;
  }
  .btn:hover { background:#7dd3fc; box-shadow:0 8px 24px rgba(56,189,248,0.25); }
  .btn:active { transform:translateY(1px); }
  .btn.secondary { background:transparent; color:var(--text-1); border:1px solid var(--border-hi); }
  .btn.secondary:hover { background:rgba(56,189,248,0.06); border-color:var(--accent); color:var(--text-0); box-shadow:none; }
  .btn.danger { background:transparent; color:#fca5a5; border:1px solid rgba(239,68,68,0.4); }
  .btn.small { padding:6px 10px; font-size:0.8rem; width:auto; margin-top:0; border-radius:8px; }

  .btn-row { display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-top:12px; }
  .top-actions { display:flex; gap:10px; margin-top:20px; flex-wrap:wrap; }
  .top-actions .btn { flex:1; min-width:180px; margin-top:0; }

  .levels { display:grid; gap:10px; margin-top:20px; }
  .level-card {
    padding:20px 24px; background:rgba(15,23,42,0.6); border:1px solid var(--border); border-radius:12px;
    cursor:pointer; transition:border-color .15s, background .15s, transform .15s; display:flex; justify-content:space-between;
    align-items:center; gap:16px; position:relative; overflow:hidden;
  }
  .level-card::before { content:''; position:absolute; left:0; top:0; bottom:0; width:3px; background:var(--accent-color,var(--accent)); transition:width .15s; }
  .level-card:hover { border-color:var(--accent-color,var(--accent)); background:rgba(30,41,59,0.6); transform:translateX(4px); }
  .level-card:hover::before { width:4px; }
  .level-card .info h3 { font-size:1.05rem; margin-bottom:4px; display:flex; align-items:center; gap:8px; font-weight:700; color:var(--text-0); }
  .level-card .info p { color:var(--text-3); font-size:0.82rem; line-height:1.45; }
  .level-card .info .level-hint { display:inline-block; margin-top:8px; font-size:0.72rem; font-weight:600; letter-spacing:0.03em; padding:4px 10px; border-radius:6px; }
  .level-hint.promote { color:#7dd3fc; background:rgba(56,189,248,0.08); border:1px solid rgba(56,189,248,0.25); }
  .level-hint.repeat { color:#64748b; background:rgba(100,116,139,0.08); border:1px solid rgba(100,116,139,0.2); }
  .level-badge { padding:6px 12px; border-radius:6px; font-weight:700; font-size:0.7rem; letter-spacing:0.08em; text-transform:uppercase; white-space:nowrap; }
  .badge-intern { background:rgba(148,163,184,0.12); color:#cbd5e1; border:1px solid #475569; }
  .badge-junior { background:rgba(34,197,94,0.10); color:#4ade80; border:1px solid rgba(34,197,94,0.4); }
  .badge-middle { background:rgba(234,179,8,0.10); color:#facc15; border:1px solid rgba(234,179,8,0.4); }
  .badge-senior { background:rgba(239,68,68,0.10); color:#f87171; border:1px solid rgba(239,68,68,0.4); }

  .progress-bar { width:100%; height:4px; background:var(--bg-2); border-radius:2px; overflow:hidden; margin-bottom:6px; }
  .progress-fill { height:100%; background:var(--accent); width:0%; transition:width .35s ease; }
  .q-meta { display:flex; justify-content:space-between; color:var(--text-3); font-size:0.75rem; margin-bottom:16px; font-weight:600; letter-spacing:0.06em; text-transform:uppercase; }
  .question { font-size:1.2rem; font-weight:600; margin-bottom:24px; line-height:1.55; color:var(--text-0); animation:slideUp 0.25s ease; }

  .options { display:grid; gap:10px; }
  .option {
    padding:16px 20px; background:rgba(15,23,42,0.5); border:1px solid var(--border); border-radius:10px; cursor:pointer;
    transition:border-color .15s, background .15s; font-size:0.95rem; display:flex; align-items:center; gap:14px;
    color:var(--text-1); text-align:left; font-weight:500; font-family:inherit; animation:slideUp 0.25s ease; animation-fill-mode:both; line-height:1.45;
  }
  .option:hover:not(.disabled) { border-color:var(--border-hi); background:rgba(30,41,59,0.6); color:var(--text-0); }
  .option.selected { border-color:var(--accent); background:rgba(56,189,248,0.08); color:var(--text-0); }
  .option.correct { border-color:var(--ok); background:rgba(34,197,94,0.08); color:var(--text-0); animation:pulse 0.4s; }
  .option.wrong { border-color:var(--err); background:rgba(239,68,68,0.08); color:var(--text-0); animation:shake 0.35s; }
  .option.disabled { pointer-events:none; }
  .option .letter { width:30px; height:30px; border-radius:6px; background:var(--bg-2); display:flex; align-items:center; justify-content:center; font-weight:700; font-size:0.82rem; flex-shrink:0; transition:background .15s, color .15s; color:var(--text-2); }
  .option.correct .letter { background:var(--ok); color:#fff; }
  .option.wrong .letter { background:var(--err); color:#fff; }
  .option.selected .letter { background:var(--accent); color:#04121e; }

  .feedback { margin-top:16px; padding:14px 18px; border-radius:10px; font-weight:600; display:none; animation:slideUp 0.25s; font-size:0.92rem; }
  .feedback.show { display:block; }
  .feedback.ok { background:rgba(34,197,94,0.08); color:#86efac; border:1px solid rgba(34,197,94,0.3); }
  .feedback.bad { background:rgba(239,68,68,0.08); color:#fca5a5; border:1px solid rgba(239,68,68,0.3); }
  .feedback .hint { display:block; margin-top:6px; font-size:0.8rem; color:var(--text-2); font-weight:400; }

  .result { text-align:center; padding:8px 0; animation:fadeIn 0.4s; }
  .result .score { font-size:4rem; font-weight:800; color:var(--accent); margin:12px 0; line-height:1; letter-spacing:-0.03em; }
  .result h2 { font-size:1.5rem; margin-bottom:8px; font-weight:700; letter-spacing:-0.01em; }
  .result p { color:var(--text-2); margin-bottom:20px; font-size:0.92rem; }
  .result .emoji-big { font-size:4rem; animation:pop 0.5s; line-height:1; }

  .stats { display:grid; grid-template-columns:repeat(3,1fr); gap:12px; margin:24px 0; }
  .stat { background:rgba(15,23,42,0.6); padding:16px; border-radius:10px; border:1px solid var(--border); }
  .stat .val { font-size:1.5rem; font-weight:700; color:var(--accent); letter-spacing:-0.02em; }
  .stat .lbl { font-size:0.7rem; color:var(--text-3); margin-top:6px; text-transform:uppercase; letter-spacing:0.1em; font-weight:600; }

  .recommendations { background:rgba(239,68,68,0.05); border:1px solid rgba(239,68,68,0.25); border-radius:12px; padding:20px; margin:20px 0; text-align:left; }
  .recommendations h3 { color:#fca5a5; font-size:0.85rem; margin-bottom:14px; display:flex; align-items:center; gap:8px; text-transform:uppercase; letter-spacing:0.1em; font-weight:700; }
  .recommendations ul { list-style:none; padding:0; }
  .recommendations li { padding:10px 0; border-bottom:1px solid rgba(148,163,184,0.08); color:var(--text-1); font-size:0.88rem; line-height:1.55; }
  .recommendations li:last-child { border-bottom:none; }
  .recommendations li b { color:var(--text-0); font-weight:600; display:block; margin-bottom:4px; }

  .promotion { background:rgba(34,197,94,0.08); border:1px solid rgba(34,197,94,0.3); border-radius:12px; padding:16px 20px; margin:16px 0; color:#86efac; font-weight:600; text-align:center; font-size:0.95rem; }
  .info-box { background:rgba(56,189,248,0.06); border:1px solid rgba(56,189,248,0.25); border-radius:12px; padding:14px 18px; margin:16px 0; color:#7dd3fc; font-size:0.88rem; text-align:center; line-height:1.5; }
  .warn-box { background:rgba(234,179,8,0.06); border:1px solid rgba(234,179,8,0.25); border-radius:12px; padding:14px 18px; margin:16px 0; color:#fde047; font-size:0.88rem; text-align:center; line-height:1.5; }

  .table-wrap { margin-top:24px; background:rgba(15,23,42,0.5); border-radius:12px; border:1px solid var(--border); overflow:hidden; }
  .table-wrap h4 { padding:14px 20px; background:rgba(15,23,42,0.8); color:var(--text-2); font-size:0.72rem; text-transform:uppercase; letter-spacing:0.12em; border-bottom:1px solid var(--border); display:flex; justify-content:space-between; align-items:center; gap:12px; flex-wrap:wrap; font-weight:700; }
  .table-wrap h4 .count { color:var(--accent); font-weight:700; }
  table { width:100%; border-collapse:collapse; }
  th, td { padding:12px 16px; text-align:left; font-size:0.85rem; border-bottom:1px solid rgba(148,163,184,0.06); }
  th { color:var(--text-3); font-weight:700; text-transform:uppercase; font-size:0.68rem; letter-spacing:0.1em; background:rgba(10,15,28,0.5); }
  td { color:var(--text-1); }
  tr:last-child td { border-bottom:none; }
  .lvl-pill { display:inline-block; padding:4px 10px; border-radius:6px; font-size:0.7rem; font-weight:700; letter-spacing:0.05em; text-transform:uppercase; }
  .score-cell { font-weight:700; color:var(--accent); }

  .shop-info { text-align:center; color:var(--text-3); font-size:0.78rem; margin-bottom:20px; padding:10px 14px; background:rgba(10,15,28,0.5); border-radius:8px; border:1px solid var(--border); letter-spacing:0.02em; }
  .shop-info b { color:var(--text-1); font-weight:600; }
  .shop-info .tab { color:var(--accent); font-weight:600; }
  .empty-state { text-align:center; padding:48px 20px; color:var(--text-3); }
  .empty-state .icon { font-size:2.5rem; margin-bottom:12px; opacity:0.5; }
  .empty-state p { font-size:0.9rem; }

  .shop-tabs { display:flex; gap:8px; flex-wrap:wrap; padding:14px 16px; background:rgba(10,15,28,0.5); border-bottom:1px solid var(--border); }
  .shop-tab { padding:8px 14px; background:rgba(15,23,42,0.6); border:1px solid var(--border); border-radius:8px; font-size:0.82rem; font-weight:600; color:var(--text-2); cursor:pointer; transition:border-color .15s, background .15s, color .15s; font-family:inherit; white-space:nowrap; }
  .shop-tab:hover { border-color:var(--border-hi); color:var(--text-1); }
  .shop-tab.active { background:rgba(56,189,248,0.1); border-color:var(--accent); color:var(--accent); }
  .shop-tab .tab-count { display:inline-block; margin-left:6px; padding:1px 6px; border-radius:10px; background:rgba(148,163,184,0.15); font-size:0.7rem; color:var(--text-3); }
  .shop-tab.active .tab-count { background:rgba(56,189,248,0.2); color:var(--accent); }

  /* Стили для выпадающего списка */
  .input-group { display: flex; gap: 8px; }
  .input-group select { flex: 1; }
  .input-group input { flex: 1; display: none; }
  .input-group input.active { display: block; }
  .input-group select.hidden { display: none; }
  .toggle-input { background: transparent; border: 1px solid var(--border); border-radius: 10px; color: var(--accent); padding: 0 16px; font-weight: 600; cursor: pointer; transition: 0.15s; font-family: inherit; }
  .toggle-input:hover { background: rgba(56,189,248,0.08); border-color: var(--accent); }

  @media (max-width: 600px) {
    body { padding: 0; align-items: stretch; background: linear-gradient(180deg, var(--bg-0) 0%, #060a14 100%); }
    .container { max-width: 100%; border-radius: 0; border-left: none; border-right: none; padding: 24px 18px 32px; min-height: 100dvh; box-shadow: none; animation: none; }
    .container::before { display: none; }
    .brand { gap: 12px; margin-bottom: 4px; }
    .brand-icon { width: 40px; height: 40px; }
    .brand-title { font-size: 1.15rem; letter-spacing: -0.01em; }
    .brand-sub { font-size: 0.6rem; letter-spacing: 0.12em; margin-top: 1px; }
    .btn { min-height: 52px; }
    .btn-row { grid-template-columns: 1fr; gap: 10px; }
    .top-actions { flex-direction: column; }
    .level-card { padding: 16px 18px; flex-direction: column; align-items: flex-start; gap: 10px; }
    .option { min-height: 54px; }
    .stats { grid-template-columns: 1fr 1fr 1fr; gap: 8px; }
    .stat { padding: 12px 8px; text-align: center; }
    .table-wrap { overflow-x: auto; }
    table { min-width: 480px; }
  }
</style>
</head>
<body>
<div class="container" id="app"></div>
<div id="modalContainer"></div>

<script>
/* ==================== ИКОНКА БРЕНДА ==================== */
const BRAND_ICON = `
<svg class="brand-icon" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
  <defs>
    <linearGradient id="camBody" x1="0" y1="0" x2="64" y2="64"><stop offset="0%" stop-color="#38bdf8"/><stop offset="100%" stop-color="#0284c7"/></linearGradient>

  </defs>
  <path d="M26 20 L60 8 L60 56 L26 44 Z" fill="url(#camBeam)"/>
  <rect x="4" y="18" width="28" height="28" rx="6" fill="url(#camBody)"/>
  <rect x="8" y="22" width="20" height="20" rx="4" fill="#0a0f1c"/>
  <circle cx="18" cy="32" r="6" fill="url(#camBody)" opacity="0.9"/>
  <circle cx="18" cy="32" r="3" fill="#0a0f1c"/>
  <circle cx="16.5" cy="30.5" r="1" fill="#7dd3fc"/>
  <rect x="14" y="46" width="8" height="4" rx="1" fill="#38bdf8"/>
  <rect x="12" y="50" width="12" height="3" rx="1" fill="#0284c7"/>

  <circle cx="42" cy="22" r="1.5" fill="#38bdf8" opacity="0.7"/>
  <circle cx="48" cy="28" r="1.5" fill="#38bdf8" opacity="0.5"/>
  <circle cx="34" cy="46" r="1.5" fill="#38bdf8" opacity="0.9"/>
  <circle cx="42" cy="42" r="1.5" fill="#38bdf8" opacity="0.7"/>

</svg>

const BRAND_BLOCK = `
  <div class="brand">
    ${BRAND_ICON}
    <div class="brand-text">
      <div class="brand-title">Face Recognition Exam</div>
      <div class="brand-sub">Система распознавания лиц</div>
    </div>
  </div>
`;

/* ==================== ВОПРОСЫ ==================== */
const QUESTIONS = {
  junior: [
    { q: "Что такое FACE RECOGNITION (FR)?", options: ["Система видеонаблюдения, которая записывает все действия клиентов","Технология распознавания лиц с помощью камер, уведомляющая о входе клиента из базы","Приложение для распознавания товаров на полках","Система контроля доступа сотрудников"], correct: 1, hint: "Раздел «Ознакомление с FR»." },
    { q: "В каком формате хранятся изображения в базе FR?", options: ["В виде обычных фотографий JPG","В векторном формате (база обезличена)","В виде видеозаписей","В текстовом формате с описанием"], correct: 1, hint: "Раздел «Ознакомление с FR»." },
    { q: "Что НЕ приходит в уведомлении в Чате?", options: ["Фото клиента","Наименование камеры входа","Домашний адрес клиента","Статус в правоохранительных органах"], correct: 2, hint: "Раздел «Чат с уведомлениями»." },
    { q: "Какие действия запрещены при работе с FR? (выберите несколько)", options: ["Показать уведомление коллеге-сотруднику магазина","Копировать/пересылать информацию из Чата","Распространять информацию о работе FR третьим лицам","Подойти к клиенту и показать, что команда поняла, кто он"], correct: 1, multiCorrect: [1, 2, 3], hint: "Раздел «Алгоритм работы»." },

const LEVEL_ORDER = ['intern', 'junior', 'middle', 'senior'];
const LEVEL_NAMES = { intern:'Intern', junior:'Junior', middle:'Middle', senior:'Senior' };
const LEVEL_ICONS = { intern:'○', junior:'●', middle:'◐', senior:'◆' };
const LEVEL_BADGE = { intern:'badge-intern', junior:'badge-junior', middle:'badge-middle', senior:'badge-senior' };
const LEVEL_COLOR = { intern:'#94a3b8', junior:'#22c55e', middle:'#eab308', senior:'#ef4444' };
const PASS_PERCENT = 80;

/* ==================== СОСТОЯНИЕ ==================== */
let state = {
  shopId: null, tabNumber: null, level: null, current: 0, score: 0,
  answered: false, selectedMulti: [], wrongHints: [], sessionQuestions: [], viewShopId: null
};

/* ==================== API И ХРАНИЛИЩЕ (Netlify) ==================== */
let allResultsData = [];

async function fetchAllResults() {
  try {
    const response = await fetch('/.netlify/functions/get-results');
    if (!response.ok) throw new Error('Network response was not ok');
    allResultsData = await response.json();
  } catch (error) {
    console.error('Ошибка загрузки данных:', error);
    allResultsData = [];
  }
}

async function recordAttempt(shopId, tab, level, score, total) {
  const newRecord = { shopId, tabNumber: tab, level, score, total, date: new Date().toISOString() };
  try {
    await fetch('/.netlify/functions/save-result', {
      method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(newRecord)
    });
    allResultsData.push(newRecord);
  } catch (error) {
    console.error('Ошибка сохранения:', error);
    alert('Не удалось сохранить результат на сервере.');
  }
}

function getAllShops() {
  const shops = new Set(allResultsData.map(r => r.shopId));
  return Array.from(shops).sort((a, b) => a.localeCompare(b, undefined, { numeric: true }));
}

function getShopData(shopId) {
  const shopResults = allResultsData.filter(r => r.shopId === shopId);
  const employees = {};
  shopResults.forEach(r => {
    if (!employees[r.tabNumber]) employees[r.tabNumber] = { level: 'intern', attempts: 0, history: [] };
    employees[r.tabNumber].history.push({ level: r.level, score: r.score, total: r.total, date: r.date });
  });
  Object.keys(employees).forEach(tab => {
    const emp = employees[tab];
    emp.history.sort((a, b) => new Date(a.date) - new Date(b.date));
    emp.attempts = emp.history.length;
    let currentLevel = 'intern';
    emp.history.forEach(h => {
      const percent = (h.score / h.total) * 100;
      if (percent >= PASS_PERCENT) {
        if (currentLevel === 'intern' && h.level === 'intern') currentLevel = 'junior';
        else if (currentLevel === 'junior' && h.level === 'middle') currentLevel = 'senior';
        else if (currentLevel === 'middle' && h.level === 'middle') currentLevel = 'senior';
      }
    });
    emp.level = currentLevel;
  });
  return { employees };
}

function getEmployee(shopId, tab) {
  const shop = getShopData(shopId);
  return shop.employees[tab] || null;
}

/* ==================== УТИЛИТЫ ==================== */
function levelName(l) { return LEVEL_NAMES[l] || l; }
function levelIcon(l) { return LEVEL_ICONS[l] || ''; }
function levelBadge(l) { return LEVEL_BADGE[l] || ''; }
function levelColor(l) { return LEVEL_COLOR[l] || '#38bdf8'; }
function formatDate(iso) { return new Date(iso).toLocaleString('ru-RU', { day:'2-digit', month:'2-digit', hour:'2-digit', minute:'2-digit' }); }
function escapeHtml(s) { return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function shuffle(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
  return a;
}

function getQuestionsForLevel(level) { return level === 'intern' ? QUESTIONS.junior : QUESTIONS[level] || []; }

function prepareSession(level) {
  const raw = getQuestionsForLevel(level);
  return shuffle(raw).map(q => {
    const correctTexts = q.multiCorrect ? q.multiCorrect.map(i => q.options[i]) : [q.options[q.correct]];
    const shuffledOptions = shuffle(q.options.map(text => ({ text, isCorrect: correctTexts.includes(text) })));
    return { q: q.q, hint: q.hint, isMulti: !!q.multiCorrect, options: shuffledOptions, correctCount: correctTexts.length };
  });
}

/* ==================== РЕНДЕР ==================== */
const app = document.getElementById('app');

function renderStart() {
  const shops = getAllShops();
  
  const shopsOptions = shops.map(s => `<option value="${escapeHtml(s)}">Магазин ${escapeHtml(s)}</option>`).join('');

  app.innerHTML = `
    ${BRAND_BLOCK}
    <p class="subtitle">Проверка знаний по системе распознавания лиц</p>
    
    <div class="field">
      <label>Номер магазина</label>
      <div class="input-group">
        ${shops.length > 0 ? `
          <select id="shopSelect">
            ${shopsOptions}
            <option value="new">+ Новый магазин...</option>
          </select>
        ` : ''}
        <input type="text" id="shopInput" placeholder="Например: 1234" inputmode="numeric" class="${shops.length === 0 ? 'active' : ''}">
      </div>
    </div>

    <div class="field">
      <label>Табельный номер</label>
      <input type="text" id="tabInput" placeholder="Например: 001" inputmode="numeric">
    </div>
    
    <button class="btn" id="startBtn">Начать тестирование →</button>
    ${shops.length > 0 ? `<div class="top-actions"><button class="btn secondary" id="viewResultsBtn">📊 Все результаты магазинов (${shops.length})</button></div>` : ''}
  `;

  const shopSelect = document.getElementById('shopSelect');
  const shopInput = document.getElementById('shopInput');
  const tabInput = document.getElementById('tabInput');

  if (shopSelect) {
    shopSelect.onchange = (e) => {
      if (e.target.value === 'new') {
        shopSelect.classList.add('hidden');
        shopInput.classList.add('active');
        shopInput.value = '';
        shopInput.focus();
      }
    };
  }

  document.getElementById('startBtn').onclick = () => {
    const shop = shopSelect && !shopSelect.classList.contains('hidden') 
                 ? shopSelect.value 
                 : shopInput.value.trim();
                 
    const tab = tabInput.value.trim();
    
    if (!shop || shop === 'new') { alert('Введите номер магазина'); return; }
    if (!tab) { alert('Введите табельный номер'); return; }
    
    state.shopId = shop; 
    state.tabNumber = tab; 
    renderLevels();
  };

  if (shops.length > 0) {
    document.getElementById('viewResultsBtn').onclick = () => { state.viewShopId = shops[0]; renderResultsView(); };

function renderLevels() {
  const emp = getEmployee(state.shopId, state.tabNumber);
  const currentLevel = emp ? emp.level : 'intern';

  let visibleLevels, targetLevel = null, nextLevelName = null;
  if (currentLevel === 'intern') { visibleLevels = ['intern']; targetLevel = 'intern'; nextLevelName = 'Junior'; }
  else if (currentLevel === 'junior') { visibleLevels = ['junior', 'middle']; targetLevel = 'middle'; nextLevelName = 'Senior'; }
  else if (currentLevel === 'middle') { visibleLevels = ['middle']; targetLevel = 'middle'; nextLevelName = 'Senior'; }
  else { visibleLevels = ['senior']; }

  const levelDescriptions = {
    intern: 'Пробный уровень. Базовые вопросы по системе FR.',
    junior: 'Основы FR, чат, алгоритм работы, обращения клиентов.',
    middle: 'Проверка оборудования, тест-портреты, ITSM.',
    senior: 'Персонал, LPS, происшествия.'
  };

  const levelsHtml = visibleLevels.map(lvl => {
    const qCount = getQuestionsForLevel(lvl).length;
    const isCurrent = lvl === currentLevel;
    let hint = '';
    if (lvl === targetLevel && nextLevelName) hint = `<span class="level-hint promote">→ Пройдите на ${PASS_PERCENT}%+, чтобы стать ${nextLevelName}</span>`;
    else if (isCurrent && currentLevel === 'senior') hint = `<span class="level-hint repeat">Максимальный уровень</span>`;
    else if (isCurrent) hint = `<span class="level-hint repeat">Текущий уровень</span>`;
    return `
      <div class="level-card" data-level="${lvl}" style="--accent-color:${levelColor(lvl)}">
        <div class="info"><h3>${levelIcon(lvl)} ${levelName(lvl)} ${isCurrent ? '<span style="font-size:0.7rem;color:#38bdf8;font-weight:600;">— текущий</span>' : ''}</h3><p>${levelDescriptions[lvl]}</p>${hint}</div>
        <span class="level-badge ${levelBadge(lvl)}">${qCount} вопр.</span>
      </div>`;
  }).join('');

  const history = emp ? emp.history : [];
  const historyHtml = history.length > 0 ? `
    <div class="table-wrap">
      <h4>История прохождений <span class="count">${history.length}</span></h4>
      <table><thead><tr><th>Уровень</th><th>Результат</th><th>Дата</th></tr></thead><tbody>
        ${history.slice().reverse().map(h => `<tr><td>${levelIcon(h.level)} ${levelName(h.level)}</td><td class="score-cell">${h.score}/${h.total}</td><td>${formatDate(h.date)}</td></tr>`).join('')}
      </tbody></table>
    </div>` : '';

  let subtitleText = currentLevel === 'intern' ? `Пройдите <b style="color:${levelColor('intern')}">Intern</b> на ${PASS_PERCENT}%+, чтобы стать <b style="color:${levelColor('junior')}">Junior</b>` : currentLevel === 'senior' ? `Вы на максимальном уровне — <b style="color:${levelColor('senior')}">Senior</b>` : `Пройдите <b style="color:${levelColor('middle')}">Middle</b> на ${PASS_PERCENT}%+, чтобы стать <b style="color:${levelColor('senior')}">Senior</b>`;

  app.innerHTML = `
    ${BRAND_BLOCK}
    <div class="shop-info" style="margin-top:20px;">Магазин: <b>${escapeHtml(state.shopId)}</b> · Табельный: <span class="tab">${escapeHtml(state.tabNumber)}</span> · Уровень: <b style="color:${levelColor(currentLevel)}">${levelIcon(currentLevel)} ${levelName(currentLevel)}</b></div>
    <div class="page-title">${currentLevel === 'senior' ? 'Senior' : 'Выбор уровня'}</div>
    <p class="subtitle">${subtitleText}</p>
    <div class="levels">${levelsHtml}</div>
    ${historyHtml}
    <div class="btn-row" style="margin-top:20px;"><button class="btn secondary" id="backBtn">← Сменить сотрудника</button><button class="btn secondary" id="viewResultsBtn">📊 Все результаты</button></div>
  `;

  document.querySelectorAll('.level-card').forEach(card => {
    card.onclick = () => {
      state.level = card.dataset.level; state.current = 0; state.score = 0; state.answered = false; state.selectedMulti = []; state.wrongHints = [];
      state.sessionQuestions = prepareSession(state.level); renderQuestion();
    };
  });
  document.getElementById('backBtn').onclick = () => { state.shopId = null; state.tabNumber = null; state.sessionQuestions = []; renderStart(); };
  document.getElementById('viewResultsBtn').onclick = () => { state.viewShopId = state.shopId; renderResultsView(); };
}

function renderResultsView() {
  const shops = getAllShops();
  if (shops.length === 0) {
    app.innerHTML = `${BRAND_BLOCK}<div class="page-title" style="margin-top:20px;">Результаты</div><div class="empty-state"><div class="icon">📭</div><p>Пока нет ни одного прохождения</p></div><button class="btn secondary" id="backBtn" style="margin-top:20px;">← На главную</button>`;
    document.getElementById('backBtn').onclick = renderStart; return;
  }

  const activeShop = state.viewShopId && shops.includes(state.viewShopId) ? state.viewShopId : shops[0];
  const shop = getShopData(activeShop);
  const employees = Object.entries(shop.employees || {});

  employees.sort((a, b) => {
    const lvlA = LEVEL_ORDER.indexOf(a[1].level); const lvlB = LEVEL_ORDER.indexOf(b[1].level);
    if (lvlA !== lvlB) return lvlB - lvlA;
    return Math.max(...b[1].history.map(h => h.score / h.total), 0) - Math.max(...a[1].history.map(h => h.score / h.total), 0);
  });

  const totalEmployees = employees.length;
  const totalAttempts = employees.reduce((s, [, d]) => s + d.attempts, 0);
  const promoted = employees.filter(([, d]) => d.level !== 'intern').length;

  const shopTabsHtml = `<div class="shop-tabs" id="shopTabs">${shops.map(s => {
    const empCount = Object.keys(getShopData(s).employees || {}).length;
    return `<button class="shop-tab ${s === activeShop ? 'active' : ''}" data-shop="${escapeHtml(s)}">Магазин ${escapeHtml(s)} <span class="tab-count">${empCount}</span></button>`;
  }).join('')}</div>`;

  const tableHtml = employees.length === 0 ? `<div class="empty-state"><div class="icon">👥</div><p>В этом магазине пока никто не проходил тест</p></div>` : `
    <table><thead><tr><th>#</th><th>Табельный</th><th>Уровень</th><th>Попыток</th><th>Лучший</th><th>Последняя</th><th></th></tr></thead><tbody>
      ${employees.map(([tab, data], i) => {
        const best = data.history.length > 0 ? data.history.reduce((acc, h) => (h.score / h.total) > acc.p ? { p: h.score / h.total, h } : acc, { p: -1, h: null }).h : null;
        const last = data.history.length > 0 ? data.history[data.history.length - 1] : null;
        return `<tr data-row-tab="${escapeHtml(tab)}"><td style="color:#64748b;">${i + 1}</td><td><b style="color:var(--text-0);">${escapeHtml(tab)}</b></td><td><span class="lvl-pill ${levelBadge(data.level)}">${levelIcon(data.level)} ${levelName(data.level)}</span></td><td>${data.attempts}</td><td class="score-cell">${best ? `${best.score}/${best.total}` : '—'}</td><td style="color:#94a3b8;font-size:0.76rem;">${last ? `${levelIcon(last.level)} ${last.score}/${last.total} · ${formatDate(last.date)}` : '—'}</td><td><button class="btn danger small" data-del-tab="${escapeHtml(tab)}" title="Удалить запись">✕</button></td></tr>`;
      }).join('')}
    </tbody></table>`;

  app.innerHTML = `
    ${BRAND_BLOCK}
    <div class="page-title" style="margin-top:20px;">Результаты магазинов</div>
    <p class="subtitle">Все прохождения по табельным номерам</p>
    <div class="stats" style="margin-bottom:20px;">
      <div class="stat"><div class="val" id="stat-employees">${totalEmployees}</div><div class="lbl">Сотрудников</div></div>
      <div class="stat"><div class="val" id="stat-attempts">${totalAttempts}</div><div class="lbl">Всего попыток</div></div>
      <div class="stat"><div class="val" id="stat-promoted">${promoted}</div><div class="lbl">Повышенных</div></div>
    </div>
    <div class="table-wrap"><h4><span>Результаты <span class="count" id="table-count">· ${employees.length} сотр.</span></span></h4>${shopTabsHtml}${tableHtml}</div>
    <div class="btn-row" style="margin-top:20px;"><button class="btn secondary" id="backBtn">← На главную</button></div>
  `;

  document.querySelectorAll('.shop-tab').forEach(tab => { tab.onclick = () => { state.viewShopId = tab.dataset.shop; renderResultsView(); }; });
  document.getElementById('backBtn').onclick = () => { state.viewShopId = null; renderStart(); };

  // Обработчик удаления с мгновенным обновлением
  document.querySelectorAll('[data-del-tab]').forEach(btn => {
    btn.onclick = async () => {
      const tab = btn.dataset.delTab;
      const password = prompt("Введите пароль администратора для удаления:");
      if (password === null) return; 
      if (password !== 'admin') { alert("Неверный пароль!"); return; }
      if (!confirm(`Удалить ВСЕ результаты сотрудника ${tab}?`)) return;
      
      try {
        const response = await fetch('/.netlify/functions/delete-result', {
          method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ shopId: activeShop, tabNumber: tab })
        });
        if (!response.ok) throw new Error('Сервер не ответил');
        
        // Мгновенное обновление локальных данных без перезагрузки страницы
        allResultsData = allResultsData.filter(r => !(r.shopId === activeShop && r.tabNumber === tab));
        
        // Находим строку и плавно удаляем её
        const row = document.querySelector(`tr[data-row-tab="${tab}"]`);
        if (row) {
          row.style.transition = 'opacity 0.3s ease';
          row.style.opacity = '0';
          setTimeout(() => {
            row.remove();
            // Обновляем счетчики
            const newShopData = getShopData(activeShop);
            const newEmployeesCount = Object.keys(newShopData.employees).length;
            
            const statEmp = document.getElementById('stat-employees');
            if (statEmp) statEmp.textContent = newEmployeesCount;
            
            const statAtt = document.getElementById('stat-attempts');
            if (statAtt) statAtt.textContent = Object.values(newShopData.employees).reduce((s, d) => s + d.attempts, 0);
            
            const tableCount = document.getElementById('table-count');
            if (tableCount) tableCount.textContent = `· ${newEmployeesCount} сотр.`;

            // Обновляем бейдж на табе магазина
            const activeTab = document.querySelector(`.shop-tab.active .tab-count`);
            if (activeTab) activeTab.textContent = newEmployeesCount;

            // Если таблица стала пустой
            if (newEmployeesCount === 0) {
              renderResultsView();
            }
          }, 300);
        }
      } catch (error) {
        console.error(error); alert("Ошибка удаления. Возможно, функция на сервере не настроена.");
      }
    };
  });
}

function renderQuestion() {
  const q = state.sessionQuestions[state.current];
  const total = state.sessionQuestions.length;
  const progress = (state.current / total) * 100;
  const isMulti = q.isMulti;

  app.innerHTML = `
    <div class="shop-info">Магазин: <b>${escapeHtml(state.shopId)}</b> · Табельный: <span class="tab">${escapeHtml(state.tabNumber)}</span> · Уровень: <b style="color:${levelColor(state.level)}">${levelIcon(state.level)} ${levelName(state.level)}</b></div>
    <div class="progress-bar"><div class="progress-fill" style="width:${progress}%"></div></div>
    <div class="q-meta" style="margin-top:16px;"><span>Вопрос ${state.current + 1} / ${total}</span><span>Счёт: ${state.score}</span></div>
    <div class="question">${escapeHtml(q.q)}</div>
    ${isMulti ? '<p style="color:#94a3b8;font-size:0.82rem;margin-bottom:14px;">Выберите один или несколько вариантов, затем нажмите «Ответить»</p>' : ''}
    <div class="options" id="options">${q.options.map((opt, i) => `<button class="option" data-idx="${i}"><span class="letter">${String.fromCharCode(65 + i)}</span><span>${escapeHtml(opt.text)}</span></button>`).join('')}</div>
    <div class="feedback" id="feedback"></div>
    ${isMulti ? `<button class="btn" id="submitMulti" style="margin-top:16px;">Ответить</button>` : ''}
  `;

  const optionEls = document.querySelectorAll('.option');

  if (isMulti) {
    optionEls.forEach(el => {
      el.onclick = () => {
        if (state.answered) return;
        const idx = parseInt(el.dataset.idx);
        if (state.selectedMulti.includes(idx)) { state.selectedMulti = state.selectedMulti.filter(x => x !== idx); el.classList.remove('selected'); }
        else { state.selectedMulti.push(idx); el.classList.add('selected'); }
      };
    });
    document.getElementById('submitMulti').onclick = () => {
      if (state.answered) return;
      if (state.selectedMulti.length === 0) { alert('Выберите хотя бы один вариант'); return; }
      const correctIdxs = q.options.map((o, i) => o.isCorrect ? i : -1).filter(i => i >= 0);
      const isCorrect = correctIdxs.slice().sort().join(',') === state.selectedMulti.slice().sort().join(',');
      finishQuestion(isCorrect, q, null, correctIdxs);
    };
  } else {
    optionEls.forEach(el => {
      el.onclick = () => {
        if (state.answered) return;
        const idx = parseInt(el.dataset.idx);
        const isCorrect = q.options[idx].isCorrect;
        const correctIdxs = q.options.map((o, i) => o.isCorrect ? i : -1).filter(i => i >= 0);
        finishQuestion(isCorrect, q, el, correctIdxs);
      };
    });
  }
}

function finishQuestion(isCorrect, q, clickedEl, correctIdxs) {
  state.answered = true;
  const optionEls = document.querySelectorAll('.option');
  const feedback = document.getElementById('feedback');

  if (isCorrect) {
    state.score++; if (clickedEl) clickedEl.classList.add('correct');
    if (feedback) { feedback.className = 'feedback ok show'; feedback.textContent = '✓ Верно'; }
  } else {
    state.wrongHints.push({ question: q.q, hint: q.hint });
    if (clickedEl) clickedEl.classList.add('wrong');
    if (feedback) { feedback.className = 'feedback bad show'; feedback.innerHTML = `✗ Неверно<span class="hint">Правильный ответ не показан — повторите материал.</span>`; }
  }

  if (q.isMulti) {
    optionEls.forEach(el => {
      const idx = parseInt(el.dataset.idx);
      if (isCorrect && correctIdxs.includes(idx)) el.classList.add('correct');
      else if (!isCorrect && state.selectedMulti.includes(idx)) el.classList.add('wrong');
    });
  }
  optionEls.forEach(o => o.classList.add('disabled'));
  const submitBtn = document.getElementById('submitMulti');
  if (submitBtn) submitBtn.classList.add('hidden');
  setTimeout(nextQuestion, 1500);
}

function nextQuestion() {
  state.current++; state.answered = false; state.selectedMulti = [];
  if (state.current >= state.sessionQuestions.length) renderResult();
  else renderQuestion();
}

async function renderResult() {
  const total = state.sessionQuestions.length;
  const score = state.score;
  const percent = Math.round((score / total) * 100);
  const passed = percent >= PASS_PERCENT;

  const oldEmp = getEmployee(state.shopId, state.tabNumber);
  const oldLevel = oldEmp ? oldEmp.level : 'intern';
  await recordAttempt(state.shopId, state.tabNumber, state.level, score, total);
  const updatedEmp = getEmployee(state.shopId, state.tabNumber);
  const newLevel = updatedEmp.level;
  const promoted = LEVEL_ORDER.indexOf(newLevel) > LEVEL_ORDER.indexOf(oldLevel);

  let emoji, title, color, message;
  if (percent === 100) { emoji = '🏆'; title = 'Идеальный результат'; color = '#4ade80'; message = 'Вы отлично знаете материал этого уровня.'; }
  else if (passed) { emoji = '✓'; title = 'Уровень пройден'; color = '#4ade80'; message = 'Материал усвоен хорошо.'; }
  else if (percent >= 60) { emoji = '◐'; title = 'Хороший результат'; color = '#38bdf8'; message = 'Вы близки к цели. Обратите внимание на разделы ниже.'; }
  else if (percent >= 40) { emoji = '!'; title = 'Удовлетворительно'; color = '#eab308'; message = 'Есть пробелы. Рекомендуем повторить указанные разделы.'; }
  else { emoji = '✕'; title = 'Нужно повторить материал'; color = '#f87171'; message = 'Изучите разделы ниже и пройдите тест заново.'; }

  const currentIdx = LEVEL_ORDER.indexOf(oldLevel);
  const passedIdx = LEVEL_ORDER.indexOf(state.level);
  const isOwnLevel = passedIdx === currentIdx;
  let nextLevelName = oldLevel === 'intern' ? 'Junior' : oldLevel === 'junior' || oldLevel === 'middle' ? 'Senior' : null;

  let promotionHtml = '';
  if (promoted) promotionHtml = `<div class="promotion">🎉 Вы повышены до уровня <b>${levelIcon(newLevel)} ${levelName(newLevel)}</b></div>`;
  else if (!passed && isOwnLevel && nextLevelName) promotionHtml = `<div class="warn-box">Для повышения до <b>${nextLevelName}</b> нужно набрать <b>${Math.ceil(total * PASS_PERCENT / 100)} из ${total}</b> (${PASS_PERCENT}%)</div>`;
  else if (!isOwnLevel && !promoted) promotionHtml = `<div class="info-box">ℹ️ Для повышения нужно сдать уровень <b>${levelName(oldLevel)}</b> на ${PASS_PERCENT}%+</div>`;

  const recommendationsHtml = state.wrongHints.length > 0 ? `<div class="recommendations"><h3>Что повторить</h3><ul>${state.wrongHints.map(w => `<li><b>${escapeHtml(w.question)}</b>${escapeHtml(w.hint)}</li>`).join('')}</ul></div>` : '';

  app.innerHTML = `
    ${BRAND_BLOCK}
    <div class="result" style="margin-top:20px;">
      <div class="emoji-big" style="color:${color};">${emoji}</div>
      <h2 style="color:${color}">${title}</h2>
      <div class="score">${score}/${total}</div>
      <p>${percent}% правильных ответов · Уровень: ${levelIcon(state.level)} ${levelName(state.level)}</p>
      <p style="color:#cbd5e1;max-width:520px;margin:0 auto 20px;">${message}</p>
      ${promotionHtml}
      <div class="stats"><div class="stat"><div class="val">${score}</div><div class="lbl">Верно</div></div><div class="stat"><div class="val">${total - score}</div><div class="lbl">Ошибок</div></div><div class="stat"><div class="val">${percent}%</div><div class="lbl">Результат</div></div></div>
      ${recommendationsHtml}
      <button class="btn" id="retryBtn">Пройти ещё раз</button>
      <div class="btn-row"><button class="btn secondary" id="levelsBtn">К выбору уровня</button><button class="btn secondary" id="viewResultsBtn">📊 Все результаты</button></div>
      <button class="btn secondary" id="shopBtn" style="margin-top:12px;">Сменить сотрудника</button>
    </div>
    ${renderShopTable()}
  `;
  window.scrollTo({ top: 0, behavior: 'smooth' });

  document.getElementById('retryBtn').onclick = () => { state.current = 0; state.score = 0; state.answered = false; state.selectedMulti = []; state.wrongHints = []; state.sessionQuestions = prepareSession(state.level); renderQuestion(); window.scrollTo({ top: 0, behavior: 'smooth' }); };
  document.getElementById('levelsBtn').onclick = () => { renderLevels(); window.scrollTo({ top: 0, behavior: 'smooth' }); };
  document.getElementById('viewResultsBtn').onclick = () => { state.viewShopId = state.shopId; renderResultsView(); window.scrollTo({ top: 0, behavior: 'smooth' }); };
  document.getElementById('shopBtn').onclick = () => { state.shopId = null; state.tabNumber = null; state.sessionQuestions = []; renderStart(); window.scrollTo({ top: 0, behavior: 'smooth' }); };
}

function renderShopTable() {
  const shop = getShopData(state.shopId);
  const employees = Object.entries(shop.employees || {});
  if (employees.length === 0) return '';
  employees.sort((a, b) => { const lvlA = LEVEL_ORDER.indexOf(a[1].level); const lvlB = LEVEL_ORDER.indexOf(b[1].level); if (lvlA !== lvlB) return lvlB - lvlA; return Math.max(...b[1].history.map(h => h.score / h.total), 0) - Math.max(...a[1].history.map(h => h.score / h.total), 0); });
  return `
    <div class="table-wrap" style="margin-top:28px;">
      <h4>Таблица магазина ${escapeHtml(state.shopId)} <span class="count">· ${employees.length} сотр.</span></h4>
      <table><thead><tr><th>Табельный</th><th>Уровень</th><th>Попыток</th><th>Лучший результат</th></tr></thead><tbody>
        ${employees.map(([tab, data]) => {
          const best = data.history.length > 0 ? data.history.reduce((acc, h) => { const p = h.score / h.total; return p > acc.p ? { p, h } : acc; }, { p: -1, h: null }).h : null;
          const isCurrent = tab === state.tabNumber;
          return `<tr style="${isCurrent ? 'background:rgba(56,189,248,0.05);' : ''}"><td><b style="color:var(--text-0);">${escapeHtml(tab)}</b>${isCurrent ? ' <span style="color:#38bdf8;font-size:0.7rem;font-weight:600;">— вы</span>' : ''}</td><td><span class="lvl-pill ${levelBadge(data.level)}">${levelIcon(data.level)} ${levelName(data.level)}</span></td><td>${data.attempts}</td><td class="score-cell">${best ? `${best.score}/${best.total}` : '—'}</td></tr>`;
        }).join('')}
      </tbody></table>
    </div>`;
}

/* ==================== СТАРТ ==================== */
async function init() {
  await fetchAllResults();
  renderStart();
}
init();
</script>
</body>
</html>
